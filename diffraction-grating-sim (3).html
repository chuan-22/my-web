<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>光栅衍射强度仿真</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",Arial,sans-serif; }
        body { background:#000; color:#e2e8f0; padding:16px 20px; }
        .title { text-align:center; font-size:22px; margin-bottom:14px; color:#f1f5f9; letter-spacing:2px; }
        .sim-box { max-width:960px; margin:0 auto; background:#000; border-radius:10px; padding:16px; }
        .curve-box { margin-bottom:6px; }
        .curve-box h3 { font-size:14px; margin-bottom:6px; color:#cbd5e1; text-align:center; }
        canvas#curve { width:100%; background:#000; border-radius:4px; display:block; }
        .pattern-box { position:relative; margin-top:2px; }
        canvas#pattern { width:100%; background:#000; border-radius:4px; display:block; }
        .formula-bar { max-width:960px; margin:10px auto 0; background:#0a0a14; border-radius:8px; padding:10px 20px; display:flex; gap:10px; justify-content:space-between; font-size:12px; color:#7a8599; border:1px solid #1a1a2e; flex-wrap:wrap; align-items:flex-start; }
        .formula-left { flex:1; min-width:300px; line-height:1.7; }
        .formula-left .fm { color:#99aabb; }
        .formula-left .fm em { color:#e8a0a0; font-style:normal; font-weight:600; }
        .formula-right { text-align:left; line-height:1.7; min-width:200px; }
        .formula-right .miss-label { color:#99aabb; }
        .formula-right .miss-val { color:#a0c4e8; font-family:monospace; font-weight:600; }
        .panel { max-width:960px; margin:10px auto 0; background:#0a0a14; border-radius:10px; padding:14px 20px; display:flex; flex-wrap:wrap; gap:14px 20px; align-items:center; justify-content:center; border:1px solid #1a1a2e; }
        .item { display:flex; align-items:center; gap:8px; font-size:13px; }
        .item label { width:90px; color:#c1c8d8; font-size:12px; line-height:1.35; text-align:right; }
        input[type="range"] { width:120px; accent-color:#38bdf8; }
        .val { min-width:42px; color:#94a3b8; text-align:right; font-size:13px; font-family:monospace; }
        .sep { width:100%; height:1px; background:#1e293b; }
        .colors { display:flex; gap:7px; margin-top:4px; align-items:center; }
        .colors-label { color:#64748b; font-size:11px; margin-right:4px; }
        .cbtn { width:24px; height:24px; border-radius:50%; border:2px solid #1e293b; cursor:pointer; transition:0.2s; }
        .cbtn.active { transform:scale(1.2); border-color:#38bdf8; box-shadow:0 0 6px rgba(56,189,248,0.5); }
        .cbtn.wave-btn { position:relative; overflow:hidden; }
        .cbtn.wave-btn::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,#ff0000,#ff9900,#ffff00,#00ff00,#0099ff,#0000ff,#9900ff); border-radius:50%; }
    </style>
</head>
<body>
    <div class="title">光栅衍射强度仿真</div>
    <div class="sim-box">
        <div class="curve-box">
            <h3>衍射光强分布曲线</h3>
            <canvas id="curve" width="880" height="320"></canvas>
        </div>
        <div class="pattern-box">
            <canvas id="pattern" width="880" height="100"></canvas>
        </div>
    </div>
    <div class="formula-bar" id="formulaBar"></div>
    <div class="panel">
        <div class="item">
            <label>光栅常数<br>d (μm)</label>
            <input type="range" id="sl_d" min="1" max="10" value="6" step="0.1">
            <span class="val" id="v_d">6.0</span>
        </div>
        <div class="item">
            <label>缝宽 a (μm)</label>
            <input type="range" id="sl_a" min="0.1" max="3" value="1" step="0.1">
            <span class="val" id="v_a">1.0</span>
        </div>
        <div class="item">
            <label>不透光宽 b<br>(μm)</label>
            <input type="range" id="sl_b" min="0.1" max="9" value="5" step="0.1">
            <span class="val" id="v_b">5.0</span>
        </div>
        <div class="item">
            <label>缝数 N</label>
            <input type="range" id="sl_N" min="2" max="50" value="5" step="1">
            <span class="val" id="v_N">5</span>
        </div>
        <div class="item">
            <label>波长 λ (nm)</label>
            <input type="range" id="sl_lam" min="380" max="780" value="550" step="5">
            <span class="val" id="v_lam" style="min-width:48px;">550</span>
        </div>
        <div class="sep"></div>
        <div class="colors">
            <span class="colors-label">快速选色：</span>
            <div class="cbtn" style="background:#ff0000" data-r="255" data-g="0" data-b="0" data-lam="650"></div>
            <div class="cbtn" style="background:#ff9900" data-r="255" data-g="153" data-b="0" data-lam="600"></div>
            <div class="cbtn" style="background:#ffff00" data-r="255" data-g="255" data-b="0" data-lam="580"></div>
            <div class="cbtn" style="background:#00ff00" data-r="0" data-g="255" data-b="0" data-lam="510"></div>
            <div class="cbtn" style="background:#0099ff" data-r="0" data-g="153" data-b="255" data-lam="475"></div>
            <div class="cbtn" style="background:#0000ff" data-r="0" data-g="0" data-b="255" data-lam="450"></div>
            <div class="cbtn" style="background:#8800cc" data-r="136" data-g="0" data-b="204" data-lam="400"></div>
            <div class="cbtn wave-btn" data-r="255" data-g="255" data-b="255" data-lam="0"></div>
        </div>
    </div>

<script>
// ==================== 画布 ====================
const curveCanvas = document.getElementById('curve');
const patternCanvas = document.getElementById('pattern');
const ctxC = curveCanvas.getContext('2d');
const ctxP = patternCanvas.getContext('2d');

// ==================== 滑块 ====================
const slD = document.getElementById('sl_d');
const slA = document.getElementById('sl_a');
const slB = document.getElementById('sl_b');
const slN = document.getElementById('sl_N');
const slLam = document.getElementById('sl_lam');
const vD = document.getElementById('v_d');
const vA = document.getElementById('v_a');
const vB = document.getElementById('v_b');
const vN = document.getElementById('v_N');
const vLam = document.getElementById('v_lam');

// ==================== 状态 ====================
let currentColor = { r:255, g:255, b:255 };
let useWhiteLight = true;

const sevenColors = [
    { r:255, g:0,   b:0,   lam:650 },
    { r:255, g:153, b:0,   lam:600 },
    { r:255, g:255, b:0,   lam:580 },
    { r:0,   g:255, b:0,   lam:510 },
    { r:0,   g:153, b:255, lam:475 },
    { r:0,   g:0,   b:255, lam:450 },
    { r:136, g:0,   b:204, lam:400 }
];

// ==================== 角度范围（与原版一致：线性theta） ====================
const thetaMin = -0.26, thetaMax = 0.26;

// ==================== 画布内边距 ====================
const cPadL = 56, cPadR = 16, cPadT = 14, cPadB = 36;
const pPadL = 56, pPadR = 16, pPadT = 4,  pPadB = 28;

// ==================== 波长转RGB ====================
function wavelengthToRGB(nm) {
    let r, g, b;
    if (nm < 380) nm = 380; if (nm > 780) nm = 780;
    if (nm < 440) { r = -(nm-440)/(440-380); g = 0; b = 1; }
    else if (nm < 490) { r = 0; g = (nm-440)/(490-440); b = 1; }
    else if (nm < 510) { r = 0; g = 1; b = -(nm-510)/(510-490); }
    else if (nm < 580) { r = (nm-510)/(580-510); g = 1; b = 0; }
    else if (nm < 645) { r = 1; g = -(nm-645)/(645-580); b = 0; }
    else { r = 1; g = 0; b = 0; }
    let f = 1;
    if (nm < 420) f = 0.3 + 0.7*(nm-380)/(420-380);
    else if (nm > 700) f = 0.3 + 0.7*(780-nm)/(780-700);
    return { r: Math.round(r*f*255), g: Math.round(g*f*255), b: Math.round(b*f*255) };
}

// ==================== 参数同步（d = a + b） ====================
function syncSliders(changed) {
    let d = parseFloat(slD.value);
    let a = parseFloat(slA.value);
    let b = parseFloat(slB.value);
    if (changed === 'a') { b = d - a; if (b < 0.1) { b = 0.1; a = d - b; slA.value = a.toFixed(1); } slB.value = b.toFixed(1); }
    else if (changed === 'b') { a = d - b; if (a < 0.1) { a = 0.1; b = d - a; slB.value = b.toFixed(1); } slA.value = a.toFixed(1); }
    else if (changed === 'd') { b = d - a; if (b < 0.1) { b = 0.1; a = d - b; slA.value = a.toFixed(1); } slB.value = b.toFixed(1); }
    d = parseFloat(slD.value); a = parseFloat(slA.value); b = parseFloat(slB.value);
    vD.textContent = d.toFixed(1); vA.textContent = a.toFixed(1); vB.textContent = b.toFixed(1);
    vN.textContent = slN.value; vLam.textContent = slLam.value;
    const c = wavelengthToRGB(parseInt(slLam.value));
    vLam.style.color = `rgb(${c.r},${c.g},${c.b})`;
}

// ==================== 物理计算（与原版一致：输入theta，内部用Math.sin(theta)） ====================
function getD() { return parseFloat(slD.value) * 1e-6; }
function getA() { return parseFloat(slA.value) * 1e-6; }
function getN() { return parseInt(slN.value); }

function intensity(theta, d, a, lam, N) {
    let u = Math.PI * a * Math.sin(theta) / lam;
    let v = Math.PI * d * Math.sin(theta) / lam;
    let single = u === 0 ? 1 : (Math.sin(u)/u) ** 2;
    let multi  = v === 0 ? N*N : (Math.sin(N*v)/Math.sin(v)) ** 2;
    return single * multi;
}

function envelope(theta, a, lam) {
    let u = Math.PI * a * Math.sin(theta) / lam;
    return u === 0 ? 1 : (Math.sin(u)/u) ** 2;
}

function multiSlit(theta, d, lam, N) {
    let v = Math.PI * d * Math.sin(theta) / lam;
    return v === 0 ? N*N : (Math.sin(N*v)/Math.sin(v)) ** 2;
}

// ==================== 绘制强度曲线（与原版逻辑一致） ====================
function drawCurve() {
    const w = curveCanvas.width, h = curveCanvas.height;
    ctxC.clearRect(0, 0, w, h);
    const pw = w - cPadL - cPadR, ph = h - cPadT - cPadB;
    const d = getD(), a = getA(), N = getN();

    if (useWhiteLight) {
        // ---- 白光（与原版一致：先找allMaxI，再逐像素绘制） ----
        let allMaxI = 0;
        sevenColors.forEach(color => {
            let lam = color.lam * 1e-9;
            for (let x = 0; x < pw; x++) {
                let t = thetaMin + (thetaMax - thetaMin) * x / pw;
                let i = intensity(t, d, a, lam, N);
                if (i > allMaxI) allMaxI = i;
            }
        });
        if (allMaxI === 0) allMaxI = 1;

        // 包络虚线
        sevenColors.forEach(color => {
            let lam = color.lam * 1e-9;
            ctxC.strokeStyle = `rgba(${color.r},${color.g},${color.b},0.4)`;
            ctxC.lineWidth = 1.5;
            ctxC.setLineDash([5, 5]);
            ctxC.beginPath();
            for (let x = 0; x < pw; x++) {
                let t = thetaMin + (thetaMax - thetaMin) * x / pw;
                let env = envelope(t, a, lam) * N * N;
                let y = cPadT + ph - (env / allMaxI) * ph;
                x === 0 ? ctxC.moveTo(cPadL + x, y) : ctxC.lineTo(cPadL + x, y);
            }
            ctxC.stroke();
        });
        ctxC.setLineDash([]);

        // 主曲线
        sevenColors.forEach(color => {
            let lam = color.lam * 1e-9;
            ctxC.strokeStyle = `rgb(${color.r},${color.g},${color.b})`;
            ctxC.lineWidth = 2;
            ctxC.beginPath();
            for (let x = 0; x < pw; x++) {
                let t = thetaMin + (thetaMax - thetaMin) * x / pw;
                let i = intensity(t, d, a, lam, N);
                let y = cPadT + ph - (i / allMaxI) * ph;
                x === 0 ? ctxC.moveTo(cPadL + x, y) : ctxC.lineTo(cPadL + x, y);
            }
            ctxC.stroke();
        });
    } else {
        // ---- 单色光（与原版一致） ----
        let lam = (currentColor.lam || parseInt(slLam.value)) * 1e-9;
        let { r, g, b } = currentColor;
        let maxI = 0, data = [];
        for (let x = 0; x < pw; x++) {
            let t = thetaMin + (thetaMax - thetaMin) * x / pw;
            let i = intensity(t, d, a, lam, N);
            data.push(i);
            if (i > maxI) maxI = i;
        }
        if (maxI === 0) maxI = 1;

        // 包络虚线
        ctxC.strokeStyle = `rgba(${r},${g},${b},0.5)`;
        ctxC.lineWidth = 1.5;
        ctxC.setLineDash([6, 4]);
        ctxC.beginPath();
        for (let x = 0; x < pw; x++) {
            let t = thetaMin + (thetaMax - thetaMin) * x / pw;
            let env = envelope(t, a, lam) * N * N;
            let y = cPadT + ph - (env / maxI) * ph;
            x === 0 ? ctxC.moveTo(cPadL + x, y) : ctxC.lineTo(cPadL + x, y);
        }
        ctxC.stroke();
        ctxC.setLineDash([]);

        // 主曲线
        ctxC.strokeStyle = `rgb(${r},${g},${b})`;
        ctxC.lineWidth = 2;
        ctxC.beginPath();
        for (let x = 0; x < pw; x++) {
            let y = cPadT + ph - (data[x] / maxI) * ph;
            x === 0 ? ctxC.moveTo(cPadL + x, y) : ctxC.lineTo(cPadL + x, y);
        }
        ctxC.stroke();
    }

    // ---- 中心线 ----
    ctxC.strokeStyle = '#333';
    ctxC.lineWidth = 1;
    let cx = cPadL + pw * (0 - thetaMin) / (thetaMax - thetaMin);
    ctxC.beginPath(); ctxC.moveTo(cx, cPadT); ctxC.lineTo(cx, cPadT + ph); ctxC.stroke();

    // ---- 坐标轴 ----
    drawCurveAxes(pw, ph);
}

// ==================== 曲线坐标轴 ====================
function drawCurveAxes(pw, ph) {
    const w = curveCanvas.width, h = curveCanvas.height;
    // X轴（sinθ 标注）
    ctxC.strokeStyle = '#4a4a60'; ctxC.lineWidth = 1;
    ctxC.beginPath(); ctxC.moveTo(cPadL, cPadT + ph); ctxC.lineTo(cPadL + pw, cPadT + ph); ctxC.stroke();

    ctxC.font = '11px monospace'; ctxC.textAlign = 'center'; ctxC.textBaseline = 'top';
    for (let i = 0; i <= 10; i++) {
        let theta = thetaMin + (thetaMax - thetaMin) * i / 10;
        let sinT = Math.sin(theta);
        let x = cPadL + pw * i / 10;
        let isMajor = i % 2 === 0;
        if (isMajor) {
            ctxC.strokeStyle = '#4a4a60';
            ctxC.beginPath(); ctxC.moveTo(x, cPadT + ph); ctxC.lineTo(x, cPadT + ph + 5); ctxC.stroke();
            ctxC.fillStyle = '#8a90a8';
            ctxC.fillText(sinT.toFixed(2), x, cPadT + ph + 7);
        } else {
            ctxC.strokeStyle = '#2a2a40';
            ctxC.beginPath(); ctxC.moveTo(x, cPadT + ph); ctxC.lineTo(x, cPadT + ph + 3); ctxC.stroke();
        }
    }
    ctxC.fillStyle = '#90a0b8'; ctxC.font = '13px "Microsoft YaHei",sans-serif';
    ctxC.fillText('sinθ', cPadL + pw / 2, cPadT + ph + 22);

    // Y轴（I/I₀）
    ctxC.strokeStyle = '#4a4a60';
    ctxC.beginPath(); ctxC.moveTo(cPadL, cPadT); ctxC.lineTo(cPadL, cPadT + ph); ctxC.stroke();

    ctxC.font = '11px monospace'; ctxC.textAlign = 'right'; ctxC.textBaseline = 'middle';
    ctxC.fillStyle = '#7a8098';
    for (let i = 0; i <= 5; i++) {
        let v = i / 5;
        let y = cPadT + ph - v * ph;
        ctxC.strokeStyle = '#4a4a60';
        ctxC.beginPath(); ctxC.moveTo(cPadL - 5, y); ctxC.lineTo(cPadL, y); ctxC.stroke();
        ctxC.fillStyle = '#7a8098';
        ctxC.fillText(v.toFixed(1), cPadL - 7, y);
        ctxC.strokeStyle = '#1a1a28';
        ctxC.beginPath(); ctxC.moveTo(cPadL, y); ctxC.lineTo(cPadL + pw, y); ctxC.stroke();
    }
    ctxC.fillStyle = '#90a0b8'; ctxC.font = '13px "Microsoft YaHei",sans-serif';
    ctxC.save(); ctxC.translate(13, cPadT + ph / 2); ctxC.rotate(-Math.PI / 2);
    ctxC.textAlign = 'center'; ctxC.fillText('相对光强  I / I₀', 0, 0); ctxC.restore();
}

// ==================== 绘制衍射光斑（横向长条） ====================
function drawPattern() {
    const w = patternCanvas.width, h = patternCanvas.height;
    const pw = w - pPadL - pPadR, ph = h - pPadT - pPadB;
    ctxP.clearRect(0, 0, w, h);
    ctxP.fillStyle = '#000'; ctxP.fillRect(pPadL, pPadT, pw, ph);

    const d = getD(), a = getA(), N = getN();
    const img = ctxP.createImageData(pw, ph);

    if (useWhiteLight) {
        // 白光（与原版一致：allMaxI全局归一化）
        let allMaxI = 0;
        const colorData = [];
        sevenColors.forEach(color => {
            let lam = color.lam * 1e-9;
            let data = [];
            for (let x = 0; x < pw; x++) {
                let t = thetaMin + (thetaMax - thetaMin) * x / pw;
                let i = intensity(t, d, a, lam, N);
                data.push(i);
                if (i > allMaxI) allMaxI = i;
            }
            colorData.push({ color, data });
        });
        if (allMaxI === 0) allMaxI = 1;
        for (let i = 0; i < img.data.length; i += 4) { img.data[i]=0; img.data[i+1]=0; img.data[i+2]=0; img.data[i+3]=255; }
        colorData.forEach(({ color, data }) => {
            for (let x = 0; x < pw; x++) {
                let f = Math.min(1, data[x] / allMaxI);
                let r = color.r * f, g = color.g * f, b = color.b * f;
                for (let y = 0; y < ph; y++) {
                    let idx = (y * pw + x) * 4;
                    img.data[idx]   = Math.min(255, img.data[idx]   + r);
                    img.data[idx+1] = Math.min(255, img.data[idx+1] + g);
                    img.data[idx+2] = Math.min(255, img.data[idx+2] + b);
                }
            }
        });
    } else {
        // 单色光（与原版一致：maxI归一化）
        let lam = (currentColor.lam || parseInt(slLam.value)) * 1e-9;
        let { r, g, b } = currentColor;
        let maxI = 0, data = [];
        for (let x = 0; x < pw; x++) {
            let t = thetaMin + (thetaMax - thetaMin) * x / pw;
            let i = intensity(t, d, a, lam, N);
            data.push(i);
            if (i > maxI) maxI = i;
        }
        if (maxI === 0) maxI = 1;
        for (let x = 0; x < pw; x++) {
            let f = Math.min(1, data[x] / maxI);
            let cr = r * f, cg = g * f, cb = b * f;
            for (let y = 0; y < ph; y++) {
                let idx = (y * pw + x) * 4;
                img.data[idx] = cr; img.data[idx+1] = cg; img.data[idx+2] = cb; img.data[idx+3] = 255;
            }
        }
    }
    ctxP.putImageData(img, pPadL, pPadT);

    // ---- 光斑下方 sinθ 坐标（与上方曲线对齐） ----
    ctxP.strokeStyle = '#4a4a60'; ctxP.lineWidth = 1;
    ctxP.beginPath(); ctxP.moveTo(pPadL, pPadT + ph); ctxP.lineTo(pPadL + pw, pPadT + ph); ctxP.stroke();
    ctxP.font = '11px monospace'; ctxP.textAlign = 'center'; ctxP.textBaseline = 'top';
    for (let i = 0; i <= 10; i++) {
        let theta = thetaMin + (thetaMax - thetaMin) * i / 10;
        let sinT = Math.sin(theta);
        let x = pPadL + pw * i / 10;
        if (i % 2 === 0) {
            ctxP.strokeStyle = '#4a4a60';
            ctxP.beginPath(); ctxP.moveTo(x, pPadT + ph); ctxP.lineTo(x, pPadT + ph + 5); ctxP.stroke();
            ctxP.fillStyle = '#8a90a8';
            ctxP.fillText(sinT.toFixed(2), x, pPadT + ph + 7);
        }
    }
    ctxP.fillStyle = '#90a0b8'; ctxP.font = '13px "Microsoft YaHei",sans-serif';
    ctxP.fillText('sinθ', pPadL + pw / 2, pPadT + ph + 20);
}

// ==================== 信息栏 ====================
function updateFormulaBar() {
    const d = parseFloat(slD.value), a = parseFloat(slA.value);
    const lam = parseInt(slLam.value), ratio = d / a;
    const lamUm = lam * 1e-3;
    const maxK = Math.ceil(Math.abs(Math.sin(thetaMax)) * d / lamUm);
    const missing = [];
    for (let k = 1; k <= maxK; k++) {
        if (Math.abs(k * a / d - Math.round(k * a / d)) < 1e-6) missing.push(k);
    }
    document.getElementById('formulaBar').innerHTML =
        '<div class="formula-left">' +
            '<div class="fm">干涉主极大：(a+b)sinθ = <em>k</em>λ</div>' +
            '<div class="fm">衍射暗纹：a sinθ = <em>m</em>λ</div>' +
            '<div class="fm">缺级条件：<em>k</em> = (a+b)/a · m（m≠0）&emsp;当前 (a+b)/a = <em>' + ratio.toFixed(2) + '</em></div>' +
        '</div>' +
        '<div class="formula-right">' +
            '<div class="miss-label">可视范围内缺级级次：</div>' +
            '<div class="miss-val">' + (missing.length > 0 ? '±' + missing.join(', ±') : '无') + '</div>' +
        '</div>';
}

// ==================== 刷新 ====================
function updateAll(changed) {
    syncSliders(changed);
    drawCurve();
    drawPattern();
    updateFormulaBar();
}

// ==================== 颜色按钮 ====================
function activateColorButton(lam) {
    document.querySelectorAll('.cbtn').forEach(b => b.classList.remove('active'));
    if (lam === 0) { document.querySelector('.wave-btn').classList.add('active'); }
    else {
        let best = null, bestDist = Infinity;
        document.querySelectorAll('.cbtn:not(.wave-btn)').forEach(b => {
            let dist = Math.abs(parseInt(b.dataset.lam) - lam);
            if (dist < bestDist) { bestDist = dist; best = b; }
        });
        if (best && bestDist < 30) best.classList.add('active');
    }
}

document.querySelectorAll('.cbtn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.cbtn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        let r = +btn.dataset.r, g = +btn.dataset.g, b = +btn.dataset.b, lam = +btn.dataset.lam;
        if (lam === 0) { useWhiteLight = true; currentColor = { r:255, g:255, b:255 }; }
        else { useWhiteLight = false; currentColor = { r, g, b, lam }; slLam.value = lam; }
        updateAll(null);
    };
});

// ==================== 滑块事件 ====================
slD.oninput = () => updateAll('d');
slA.oninput = () => updateAll('a');
slB.oninput = () => updateAll('b');
slN.oninput = () => updateAll(null);
slLam.oninput = () => {
    let lam = parseInt(slLam.value);
    let c = wavelengthToRGB(lam);
    currentColor = { ...c, lam };
    useWhiteLight = false;
    activateColorButton(lam);
    updateAll(null);
};

// ==================== 初始化 ====================
syncSliders(null);
updateAll(null);
</script>
</body>
</html>
